# keyring-tui configuration
#
# Copy to $XDG_CONFIG_HOME/keyring-tui/config.toml. Every value below is the
# default, so an empty file behaves identically to this one, and a missing
# file is not an error.
#
# A malformed file *is* an error, reported before the terminal is taken over:
# a config that silently does nothing is worse than one that refuses to load.
# Unknown keys are rejected rather than ignored, so a typo tells you instead
# of quietly doing nothing.
#
# Run `keyring-tui keys` to see what a config resolves to.

# ─── Theme ───────────────────────────────────────────────────────────────────

[theme]
# "terminal" follows your terminal's own palette, so a transparent or themed
# terminal shows through. Also: "catppuccin-mocha", "gruvbox-dark", "nord".
preset = "terminal"

# "terminal" is also the only preset that works on a light terminal. It makes
# `dim` and `border` the terminal's own foreground plus the DIM attribute,
# rather than a colour: no *colour* can be quiet on both light and dark
# backgrounds. ANSI 8 ("bright black") is the usual choice and measures 1.05:1
# against the background on a light theme, where under ~3:1 is unreadable;
# ANSI 7 is what "reset" already resolves to, so the slot would do nothing.
# Naming an explicit `dim` or `border` colour below replaces the attribute —
# a colour you chose should be shown, not faded.
#
# Individual colours can be overridden on top of the preset. Values are either
# hex ("#89b4fa" or "0x89b4fa") or an ANSI name: reset, black, red, green,
# yellow, blue, magenta, cyan, gray, dark-gray, and bright-red through
# bright-white.
#
# Names are normalised the way ratatui normalises its own, so a value copied
# from another ratatui app's config means the same thing here: case, spaces,
# `-` and `_` are ignored and `bright` and `light` are the same word, making
# "bright-red", "brightred", "light_red" and "lightred" one spelling.
#
# Two words are rejected rather than guessed at, because they are the only
# ones where the two vocabularies disagreed *silently*:
#
#   "white"        ratatui reads it as ANSI 15, this file used to read it as
#                  ANSI 7. Write "bright-white" or "gray".
#   "bright-gray"  ratatui folds it to ANSI 15 despite the name. Write
#                  "bright-white" or "dark-gray".
#
# Prefer an ANSI name to hex if you switch themes live: a terminal re-resolves
# its palette when it is told to, so named colours follow the switch, while a
# hex value stays as written until keyring-tui restarts.
#
# Slots:
#
#   fg, bg              text and background; "reset" keeps the terminal's own
#   dim                 field labels, schemas, timestamps, hints
#   border              an unfocused pane's border
#   border_focused      the focused pane's border
#   cursor_fg/bg        the selected row, and the selected tab
#   status_fg/bg        the status bar
#   accent              headings, [sk] and [card] markers
#   ok                  [agent], "in agent: yes"
#   warn                [locked], [expired], [revoked], a modal's border
#   danger              errors
#   secret              a revealed password — deliberately loud
#
# [theme.colors]
# border_focused = "#fabd2f"
# secret = "bright-red"     # it is on screen; it should look like it
# warn = "yellow"           # locked keyrings, expired keys

# ─── The colour overlay ──────────────────────────────────────────────────────
#
# A second, optional colour file, layered over `[theme.colors]` above. It
# exists for tools that recolour a desktop from the current wallpaper —
# wallust, pywal — which re-derive a palette on every wallpaper change and
# have no business owning the file that also holds your keymap.
#
# There is nothing to configure here: the file is written by that tool, and
# this section documents the contract so one can be written to match.
#
#   Path    $XDG_CACHE_HOME/wallust/colors-keyring-tui.toml, falling back to
#           ~/.cache/wallust/colors-keyring-tui.toml.
#           $KEYRING_TUI_COLORS_OVERLAY overrides it outright.
#
#   Shape   a TOP-LEVEL [colors] table — not [theme.colors] — so every file in
#           a wallust template directory has the same shape. Slot names and
#           values are exactly as above:
#
#               [colors]
#               dim    = "blue"
#               border = "#5e81ac"
#
#   Merge   per key, over [theme.colors]. An overlay naming only `border`
#           leaves the other thirteen slots as this file has them, and
#           [theme] / [theme.colors] are created if this file omits them.
#
#   Absent  a missing, unreadable or malformed overlay means "use the config"
#           and is silently nothing. That is the normal state: it is what
#           every theme that is not wallpaper-derived wants.
#
#   Typos   a key that is not a colour slot is dropped, not rejected. This
#           file failing loudly is right because you wrote it; the overlay is
#           machine-written, and the same rule would let a wallpaper change
#           stop a key manager from starting. `keyring-tui theme` names
#           anything that was dropped.
#
#   Reload  none. keyring-tui reads its configuration once at startup, so a
#           new overlay applies to the next run. No hook, no file watcher.
#
# Run `keyring-tui theme` to see the resolved result, which slot came from
# where, and anything the overlay named that was ignored.

# ─── Keybindings ─────────────────────────────────────────────────────────────
#
# Three modes, because `y` confirms a prompt and exports a key in the main
# view, and in a text field it is just the letter y:
#
#     main      the lists — navigation, sections, per-section operations
#     prompt    a modal question: a confirmation, or the new-key chooser
#     input     a text field — a path, a host, a search term
#
# Four tables per mode, applied in this order:
#
#     base      start from nothing but this — replaces the defaults entirely
#     set       these ACTIONS get exactly these keys, losing the ones they had
#     extra     these KEYS get these actions, on top of whatever is there
#     unbind    these keys do nothing; applied last, so nothing reinstates them
#
# `set` vs `extra` is the distinction that matters:
#
#     set   = [["MoveDown", "e"]]   -- "move down is on e now"; j stops working
#     extra = [["MoveDown", "e"]]   -- "e also moves down";     j still works
#
# `set` replaces an action's other keys, so list every one you want to keep --
# except the arrows, Esc, Enter and ctrl+c, which it never retires, so a
# remapped keymap always leaves a way out. Use `unbind = ["down"]` if you
# really want an arrow gone. `unbind` is prefix-based: unbinding "g" also
# removes any "g…" chord, or "g" would still be swallowed while keyring-tui
# waited for the rest.
#
# A key combo is a single key, a key with modifiers, or an array for a chord:
#
#     "s"                          -- plain key, case-sensitive: G is not g
#     "ctrl+c"
#     { key = "d", mod = ["Ctrl"] }
#     ["z", "z"]                   -- chord: z then z
#
# Modifiers: "Alt", "Ctrl", "Shift", "Super".
# Named keys: enter, space, tab, backtab, backspace, esc, up, down, left,
# right, home, end, pageup, pagedown, delete, insert, f1-f12.
#
# There is no chord timeout: a key that completes a binding fires at once, so
# `d` and `dd` cannot coexist. Bind the longer one only.
#
# Actions in the `main` mode. A section-specific action does nothing in the
# other sections, which is why one key can mean "remove from the agent" in
# SSH Keys and "delete this key" in GPG Keys:
#
#   anywhere    Quit Help Refresh NextSection PrevSection
#               SectionPasswords SectionGpgKeys SectionSshKeys
#               MoveDown MoveUp First Last FocusLeft FocusRight
#   Passwords   Unlock Lock ToggleSecret FilterItems DeleteItem
#               NewKeyring DeleteKeyring CopySecret
#   SSH Keys    AgentAdd AgentRemove NewSshKey SshCopyId SshPassphrase
#               SshDelete CopySshKey CopySshFingerprint
#   GPG Keys    GpgEdit GpgExport GpgPublish GpgDelete NewGpgKey
#               ToggleGpgFilter GpgImport GpgSearch CopyGpgFingerprint
#
# Actions in the `prompt` mode: Confirm Cancel Choose1 Choose2 Choose3.
#
# Actions in the `input` mode — a text field, where every printable key is
# literal text, so only these are bound: Confirm Cancel Backspace DeleteChar
# CursorLeft CursorRight CursorHome CursorEnd DeleteWord ClearBefore.
#
# The field is never a passphrase box. Anything needing a secret hands the
# terminal to pinentry, ssh-add or gpg, so there is no masked mode here.

[keys.main]
# Move navigation onto your own keys, retiring h/j/k/l for it and leaving
# every other binding untouched. `set` also takes each key away from whatever
# else held it, so `n` stops being new-key and `e` stops being edit:
# set = [
#     ["MoveDown",   "e"],
#     ["MoveUp",     "i"],
#     ["FocusLeft",  "n"],
#     ["FocusRight", "o"],
#     ["FocusRight", "enter"],   # a SECOND entry, not ["o","enter"] --
#                                # an array means a CHORD: o then Enter
# ]
#
# Having moved `n` and `e`, give their old jobs somewhere to live:
# extra = [
#     ["NewSshKey", "N"],
#     ["NewGpgKey", "N"],
#     ["GpgEdit",   "E"],
# ]
#
# Free a key for a terminal multiplexer -- zellij or tmux closing a popup on
# Esc only gets Esc if keyring-tui is not sitting on it:
# unbind = ["esc"]

[keys.input]
# Printable keys are text here, so only keys that cannot be typed are bound.
# extra = [
#     ["ClearBefore", "ctrl+k"],
# ]

[keys.prompt]
# The confirmation and chooser modals. Printable keys are safe to bind here:
# there are no text fields anywhere in keyring-tui.
# extra = [
#     ["Confirm", "enter"],
#     ["Cancel",  "backspace"],
# ]

[clipboard]
# Seconds before a copied SECRET is wiped from the clipboard. 0 disables the
# wipe. Public keys and fingerprints are not secret and are never wiped --
# they are meant to be pasted whenever, and clearing them would only annoy.
#
# The wipe reads the clipboard back first and leaves it alone if it no longer
# holds what keyring-tui put there, so a copy you made in the meantime is
# never discarded. Quitting with a wipe still pending does it on the way out.
# clear_after = 45

# Which commands reach the clipboard. Left unset, keyring-tui picks by what
# the session looks like and what is installed: wl-copy on Wayland, then
# xclip or xsel on X11, then pbcopy. Set these only if that guesses wrong.
#
# `copy` receives the text on standard input. `paste` is how the wipe checks
# what is on the clipboard before clearing it; give it alongside `copy` or
# the wipe goes ahead without looking.
#
# copy  = ["wl-copy", "--type", "text/plain"]
# paste = ["wl-paste", "--no-newline", "--type", "text/plain"]
#
# A tmux buffer instead of the X/Wayland clipboard:
# copy  = ["tmux", "load-buffer", "-"]
# paste = ["tmux", "save-buffer", "-"]
